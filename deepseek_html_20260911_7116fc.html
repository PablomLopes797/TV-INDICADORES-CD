<style>
:root{
  --bg-0:#050a1f;
  --bg-1:#0a1230;
  --bg-2:#0f1a3d;
  --line:rgba(99,140,255,.18);
  --line-strong:rgba(99,140,255,.4);
  --ink:#f5f8ff;
  --ink-soft:#a8b6d9;
  --ink-faint:#6b7ba5;
  --blue:#3b82f6;
  --blue-2:#60a5fa;
  --cyan:#22d3ee;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#ef4444;
  --purple:#a855f7;
  --pink:#ec4899;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg-0);color:var(--ink);-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(ellipse at 15% 10%, rgba(59,130,246,.16), transparent 45%),
    radial-gradient(ellipse at 85% 90%, rgba(168,85,247,.14), transparent 45%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
}

/* ============== LAYOUT PRINCIPAL (16:9) ============== */
.tv-shell{
  width:100vw;height:100vh;
  display:grid;
  grid-template-rows: clamp(70px,9vh,110px) 1fr clamp(56px,7vh,82px);
  padding: 0 clamp(18px,2vw,34px);
}

/* ============== HEADER ============== */
.tv-header{
  display:flex;align-items:center;justify-content:space-between;
  gap: clamp(12px,2vw,32px);
  border-bottom:1px solid var(--line);
  position:relative;
}
.tv-header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--blue) 30%,var(--cyan) 50%,var(--blue) 70%,transparent 100%);
  opacity:.7;
}
.brand{display:flex;align-items:center;gap:clamp(12px,1.2vw,20px);min-width:0}
.brand .mark{
  width:clamp(42px,4vw,58px);height:clamp(42px,4vw,58px);
  border-radius:clamp(10px,1vw,14px);
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:800;
  font-size:clamp(15px,1.5vw,22px);color:#04122a;
  box-shadow:0 0 0 1px rgba(96,165,250,.4),0 0 30px rgba(59,130,246,.55),inset 0 1px 0 rgba(255,255,255,.4);
  flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-text h1{
  font-size:clamp(16px,1.7vw,26px);font-weight:900;letter-spacing:.6px;
  background:linear-gradient(90deg,#ffffff,#a8ccff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-text p{
  font-size:clamp(10px,1vw,13px);color:var(--ink-faint);
  letter-spacing:2.5px;text-transform:uppercase;font-weight:600;margin-top:2px;
}

.meta{display:flex;align-items:center;gap:clamp(10px,1.2vw,20px)}
.period-chip{
  padding: clamp(6px,.7vh,10px) clamp(12px,1.2vw,20px);
  border:1px solid var(--line-strong);
  border-radius:99px;
  background:rgba(59,130,246,.10);
  font-size:clamp(11px,1vw,14px);
  font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:#c9d9ff;
  white-space:nowrap;
}
.clock{
  font-family:var(--mono);font-weight:700;
  font-size:clamp(18px,1.9vw,30px);
  color:var(--ink);
  letter-spacing:1px;
  white-space:nowrap;
  text-shadow:0 0 20px rgba(96,165,250,.35);
}
.clock .date{
  display:block;font-family:'Inter',sans-serif;
  font-size:clamp(9px,.85vw,12px);font-weight:600;
  color:var(--ink-faint);letter-spacing:2px;text-transform:uppercase;
  text-align:right;margin-top:2px;
}
.gear{
  width:clamp(40px,3.4vw,52px);height:clamp(40px,3.4vw,52px);
  border-radius:50%;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.04);color:var(--ink);
  font-size:clamp(16px,1.5vw,22px);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.25s;flex-shrink:0;
}
.gear:hover{background:rgba(59,130,246,.22);border-color:var(--blue);transform:rotate(45deg)}

/* ============== STAGE (chart) ============== */
.tv-stage{
  position:relative;padding: clamp(14px,1.5vh,26px) 0;
  min-height:0;min-width:0;
}
.slide{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  animation: slideIn .55s cubic-bezier(.2,.9,.25,1);
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(14px) scale(.995)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.slide-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:clamp(12px,2vw,32px);
  padding: 0 clamp(6px,1vw,20px) clamp(8px,1vh,18px);
  border-bottom:1px solid var(--line);
  margin-bottom: clamp(10px,1.5vh,22px);
}
.slide-head .tt{
  display:flex;flex-direction:column;min-width:0;
}
.slide-head h2{
  font-size:clamp(20px,2.4vw,38px);font-weight:900;letter-spacing:.4px;line-height:1.05;
  background:linear-gradient(90deg,#ffffff,#c1d4ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.slide-head p{
  font-size:clamp(11px,1.05vw,15px);color:var(--ink-faint);font-weight:600;
  letter-spacing:2.2px;text-transform:uppercase;margin-top:6px;
}
.slide-head .total-badge{
  flex-shrink:0;
  padding: clamp(8px,.9vh,14px) clamp(16px,1.6vw,26px);
  border-radius:14px;
  border:1px solid rgba(96,165,250,.35);
  background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(34,211,238,.08));
  text-align:right;
}
.total-badge .lbl{
  font-size:clamp(9px,.85vw,12px);font-weight:800;letter-spacing:2px;
  color:var(--ink-faint);text-transform:uppercase;
}
.total-badge .val{
  font-family:var(--mono);font-weight:800;
  font-size:clamp(20px,2.1vw,34px);
  color:var(--blue-2);line-height:1;margin-top:4px;
  text-shadow:0 0 22px rgba(96,165,250,.5);
}

.chart-wrap{
  flex:1;min-height:0;min-width:0;
  position:relative;
  padding: 0 clamp(4px,.6vw,12px);
}
.chart-wrap canvas{display:block}

/* ============== KPI PANEL (slide Resumo) ============== */
.kpi-grid{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(14px,1.4vw,26px);
  padding: clamp(6px,1vh,16px) clamp(4px,.6vw,12px);
}
.kpi-card{
  background:linear-gradient(160deg, rgba(59,130,246,.10), rgba(10,20,50,.4));
  border:1px solid var(--line-strong);
  border-radius: clamp(14px,1.4vw,22px);
  padding: clamp(16px,2.4vh,34px) clamp(18px,1.8vw,30px);
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
  min-width:0;
}
.kpi-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
}
.kpi-card.amber::before{background:linear-gradient(90deg,var(--amber),#fbbf24)}
.kpi-card.red::before{background:linear-gradient(90deg,var(--red),#f87171)}
.kpi-card.purple::before{background:linear-gradient(90deg,var(--purple),var(--pink))}
.kpi-card.green::before{background:linear-gradient(90deg,var(--green),#4ade80)}
.kpi-card .lbl{
  font-size:clamp(10px,1.05vw,15px);font-weight:800;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--ink-faint);
  overflow:hidden;text-overflow:ellipsis;
}
.kpi-card .val{
  font-family:var(--mono);font-weight:900;
  font-size:clamp(34px,4.6vw,82px);line-height:1;
  color:var(--blue-2);
  margin: clamp(10px,1.2vh,20px) 0;
  text-shadow:0 0 30px rgba(96,165,250,.4);
  word-break:break-word;
}
.kpi-card.amber .val{color:var(--amber);text-shadow:0 0 30px rgba(245,158,11,.4)}
.kpi-card.red .val{color:#f87171;text-shadow:0 0 30px rgba(239,68,68,.45)}
.kpi-card.purple .val{color:#c084fc;text-shadow:0 0 30px rgba(168,85,247,.4)}
.kpi-card.green .val{color:#4ade80;text-shadow:0 0 30px rgba(34,197,94,.4)}
.kpi-card .sub{
  font-size:clamp(11px,1.05vw,15px);color:var(--ink-soft);
  font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ============== FOOTER ============== */
.tv-footer{
  display:grid;
  grid-template-columns: auto 1fr auto;
  align-items:center;
  gap: clamp(14px,1.6vw,28px);
  border-top:1px solid var(--line);
  padding-top: clamp(8px,1vh,14px);
  position:relative;
}
.tv-footer::before{
  content:"";position:absolute;left:0;right:0;top:-1px;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan) 50%,transparent);
  opacity:.45;
}
.dots{display:flex;gap:clamp(6px,.7vw,12px);flex-wrap:wrap;max-width:40vw;align-items:center}
.dot{
  width:clamp(11px,1vw,15px);height:clamp(11px,1vw,15px);
  border-radius:50%;
  border:1px solid var(--line-strong);
  background:rgba(255,255,255,.06);
  cursor:pointer;transition:.25s;padding:0;
}
.dot:hover{background:rgba(96,165,250,.35);transform:scale(1.15)}
.dot.active{
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  border-color:var(--blue-2);
  box-shadow:0 0 16px rgba(96,165,250,.75);
  transform:scale(1.2);
}
.progress-wrap{
  height:clamp(4px,.55vh,8px);
  background:rgba(255,255,255,.07);
  border-radius:99px;overflow:hidden;
  position:relative;
}
.progress-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  border-radius:99px;
  box-shadow:0 0 20px rgba(96,165,250,.65);
  transition: width .18s linear;
}
.controls{display:flex;gap:clamp(6px,.7vw,12px);align-items:center}
.controls button{
  width:clamp(36px,3vw,46px);height:clamp(36px,3vw,46px);
  border-radius:50%;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.05);color:var(--ink);
  font-size:clamp(13px,1.2vw,17px);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;
}
.controls button:hover{background:rgba(59,130,246,.28);border-color:var(--blue);transform:scale(1.06)}

/* ============== OVERLAY DE CONFIG ============== */
.config-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(2,6,23,.82);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;
  padding: 4vh 4vw;
  animation: fadeIn .25s ease;
}
.config-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.config-card{
  width:min(720px,100%);max-height:92vh;overflow-y:auto;
  background:linear-gradient(160deg,var(--bg-2),var(--bg-0));
  border:1px solid var(--line-strong);border-radius:22px;
  padding: clamp(22px,2.4vw,38px);
  box-shadow:0 40px 100px rgba(0,0,0,.6), 0 0 60px rgba(59,130,246,.18) inset;
  animation: slideIn .4s cubic-bezier(.2,.9,.25,1);
}
.config-card h3{
  font-size:clamp(17px,1.5vw,22px);font-weight:900;letter-spacing:.4px;
  margin-bottom:6px;
}
.config-card .hint{
  font-size:clamp(11px,1vw,13px);color:var(--ink-faint);
  margin-bottom: clamp(18px,2vh,28px);
}
.cfg-field{
  display:flex;flex-direction:column;gap:8px;margin-bottom: clamp(14px,1.6vh,22px);
}
.cfg-field label{
  font-size:clamp(11px,1vw,13px);font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--ink-soft);
}
.cfg-field input[type=number],
.cfg-field input[type=text],
.cfg-field select{
  width:100%;padding: clamp(11px,1.1vh,15px) clamp(14px,1.2vw,18px);
  background:rgba(255,255,255,.05);
  border:1px solid var(--line-strong);border-radius:12px;
  color:var(--ink);font-size:clamp(14px,1.15vw,16px);font-weight:600;
  font-family:var(--mono);
  transition:.2s;
}
.cfg-field input:focus,.cfg-field select:focus{
  outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(59,130,246,.22);
  background:rgba(255,255,255,.08);
}
.cfg-grid-2{
  display:grid;grid-template-columns:1fr 1fr;gap: clamp(14px,1.4vw,20px);
}
.cfg-charts-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap: clamp(8px,1vh,12px) clamp(14px,1.4vw,24px);
  margin-top: 6px;
}
.cfg-charts-grid label.chk{
  display:flex;align-items:center;gap:10px;
  padding: clamp(10px,1.1vh,14px) clamp(12px,1vw,16px);
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:10px;
  cursor:pointer;transition:.2s;font-size:clamp(12px,1vw,14px);font-weight:600;
  color:var(--ink-soft);
}
.cfg-charts-grid label.chk:hover{border-color:var(--blue);background:rgba(59,130,246,.12);color:var(--ink)}
.cfg-charts-grid label.chk input{accent-color:var(--blue);width:18px;height:18px;cursor:pointer;flex-shrink:0}
.cfg-actions{
  display:flex;justify-content:flex-end;gap: clamp(10px,1vw,16px);
  margin-top: clamp(18px,2vh,28px);padding-top: clamp(16px,2vh,24px);
  border-top:1px solid var(--line);
}
.btn{
  padding: clamp(11px,1.2vh,15px) clamp(20px,1.8vw,30px);
  border-radius:12px;border:1px solid transparent;
  font-weight:800;font-size:clamp(13px,1.05vw,15px);letter-spacing:.5px;
  cursor:pointer;transition:.2s;font-family:'Inter',sans-serif;
}
.btn.primary{
  background:linear-gradient(135deg,var(--blue),#2563eb);
  color:#fff;
  box-shadow:0 8px 26px rgba(59,130,246,.45);
}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(59,130,246,.6)}
.btn.ghost{
  background:transparent;border-color:var(--line-strong);color:var(--ink-soft);
}
.btn.ghost:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.btn.danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.4);color:#fca5a5}
.btn.danger:hover{background:rgba(239,68,68,.3);color:#fff}

/* ============== ESTADOS ============== */
.loading-screen{
  position:fixed;inset:0;z-index:9000;
  background:var(--bg-0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap: clamp(18px,2.4vh,32px);
  transition:opacity .6s ease;
}
.loading-screen.hide{opacity:0;pointer-events:none}
.loading-mark{
  width:clamp(64px,6vw,96px);height:clamp(64px,6vw,96px);
  border-radius:20px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:900;
  font-size:clamp(22px,2.2vw,34px);color:#04122a;
  box-shadow:0 0 0 1px rgba(96,165,250,.4),0 0 50px rgba(59,130,246,.7);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.loading-text{
  font-size:clamp(13px,1.2vw,17px);font-weight:700;
  letter-spacing:3px;text-transform:uppercase;color:var(--ink-soft);
}
.loading-spinner{
  width:clamp(30px,2.8vw,42px);height:clamp(30px,2.8vw,42px);
  border:3px solid rgba(96,165,250,.15);
  border-top-color:var(--cyan);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.empty-slide{
  display:flex;align-items:center;justify-content:center;
  height:100%;color:var(--ink-faint);font-size:clamp(14px,1.4vw,20px);
  font-weight:600;
}

.error-banner{
  position:fixed;top: clamp(14px,1.4vh,22px);left:50%;transform:translateX(-50%);
  padding: clamp(10px,1.1vh,14px) clamp(18px,1.6vw,26px);
  background:rgba(239,68,68,.16);
  border:1px solid rgba(239,68,68,.5);
  border-radius:12px;color:#fca5a5;
  font-size:clamp(12px,1vw,14px);font-weight:700;
  z-index:9998;display:none;
}
.error-banner.show{display:block}

/* ============== FULLSCREEN HINT ============== */
.fs-hint{
  position:fixed;bottom: clamp(14px,1.4vh,22px);right: clamp(14px,1.4vw,22px);
  font-size:clamp(10px,.9vw,12px);color:var(--ink-faint);
  font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  background:rgba(5,10,31,.7);padding:8px 14px;border-radius:99px;
  border:1px solid var(--line);z-index:50;
  transition:.3s;
}
.fs-hint.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>

<!-- ============ LOADING ============ -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-mark">TV</div>
  <div class="loading-text">Conectando ao banco de dados…</div>
  <div class="loading-spinner"></div>
</div>

<!-- ============ ERRO ============ -->
<div class="error-banner" id="errorBanner"></div>

<!-- ============ SHELL ============ -->
<div class="tv-shell">

  <header class="tv-header">
    <div class="brand">
      <div class="mark">TV</div>
      <div class="brand-text">
        <h1>INDICADOR DE AVARIAS</h1>
        <p>TRIAGEM VISION · MONITORAMENTO OPERACIONAL</p>
      </div>
    </div>
    <div class="meta">
      <div class="period-chip" id="periodChip">Últimos 30 dias</div>
      <div class="clock">
        <span id="clockTime">--:--:--</span>
        <span class="date" id="clockDate">--/--/----</span>
      </div>
      <button class="gear" id="btnConfig" title="Configurações (S)">⚙</button>
    </div>
  </header>

  <main class="tv-stage" id="tvStage">
    <!-- Slides são renderizados dinamicamente aqui -->
  </main>

  <footer class="tv-footer">
    <div class="dots" id="dots"></div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="controls">
      <button id="btnPrev" title="Anterior (←)">◀</button>
      <button id="btnPlay" title="Pausar / Retomar (Espaço)">⏸</button>
      <button id="btnNext" title="Próximo (→)">▶</button>
    </div>
  </footer>

</div>

<div class="fs-hint" id="fsHint">Pressione <b>F</b> para tela cheia · <b>S</b> para configurações</div>

<!-- ============ OVERLAY CONFIG ============ -->

function loadConfig() {

    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    const parsed = JSON.parse(raw);
    return {
      intervalSec: Number(parsed.intervalSec) || DEFAULT_CONFIG.intervalSec,
      period: parsed.period || DEFAULT_CONFIG.period,
      active: Object.assign({}, DEFAULT_CONFIG.active, parsed.active || {})
    };
  } catch (e) {
    return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  }
}
function saveConfig() {

/* ---------- ESTADO ---------- */
let allRows = [];              // todas as linhas unificadas
let currentIdx = 0;            // índice do slide atual
let activeSlides = [];         // slides ativos (filtrados por CONFIG.active)

/* ---------- UTILS ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtNum(n){ return Math.round(Number(n)||0).toLocaleString('pt-BR'); }
function fmtPct(n,t){ return t>0 ? ((n/t)*100).toFixed(1).replace('.',',')+'%' : '0%'; }

function calcularTurno(date) {
  const d = date || new Date();
  const minutos = d.getHours()*60 + d.getMinutes();
  if (minutos >= 7*60 && minutos < 15*60+20) return 1;
  if (minutos >= 15*60+20 && minutos < 23*60) return 2;
  return 3;
}
function extractCd(apanha) {
  if (!apanha) return null;
  const first = String(apanha).split(/[-\s]/)[0];
  return /^\d+$/.test(first) ? first : null;
}
function sumQty(rows){ return (rows||[]).reduce((s,r)=>s+(Number(r.QTD_UNIDADE)||0),0); }
function agruparSoma(rows,campo,topN){
  const m = {};
  rows.forEach(r=>{
    const c = (r[campo] ?? "").toString().trim();
    if(!c) return;
    m[c] = (m[c]||0) + (Number(r.QTD_UNIDADE)||0);
  });
  let a = Object.entries(m).sort((a,b)=>b[1]-a[1]);
  if(topN) a = a.slice(0,topN);
  return a;
}

/* ---------- PERÍODO (cutoff) ---------- */
function getCutoff() {
  const p = CONFIG.period;
  if (p === 'all') return null;
  const now = new Date();
  if (p === 'today') {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return d.getTime();
  }
  const days = Number(p);
  const d = new Date(now.getTime() - days*86400000);
  d.setHours(0,0,0,0);
  return d.getTime();
}
function filterByPeriod(rows) {
  const cut = getCutoff();
  if (!cut) return rows;
  return rows.filter(r => {
    const d = new Date(r.DTA_HORA);
    return !isNaN(d) && d.getTime() >= cut;
  });
}
function periodLabel() {
  const p = CONFIG.period;
  if (p === 'today') return "Hoje";
  if (p === 'all') return "Todo o período";
  return "Últimos " + p + " dias";
}

/* ---------- FETCH DE DADOS ---------- */
async function fetchAllRows() {
  if (!sb) throw new Error("Supabase não configurado.");
  const [l,r,d,g] = await Promise.all([
    sb.from("BD_LANC").select("*").limit(5000),
    sb.from("BD_RETRABALHO").select("*").limit(5000),
    sb.from("BD_DESCARTE").select("*").limit(5000),
    sb.from("BD_GAIOLA").select("*").limit(5000)
  ]);
  if (l.error) throw l.error;
  if (r.error) throw r.error;
  if (d.error) throw d.error;
  if (g.error) throw g.error;

  const rows = [];
  (l.data||[]).forEach(r=>rows.push({...r, TIPO:"Lançamento"}));
  (r.data||[]).forEach(r=>rows.push({...r, TIPO:"Retrabalho"}));
  (d.data||[]).forEach(r=>rows.push({...r, TIPO:"Descarte"}));
  (g.data||[]).forEach(r=>{
    const qtd = Number(r["QTD UN"]) || 0;
    const novo = {...r, QTD_UNIDADE: qtd, TIPO:"Gaiola"};
    if (r.DTA_HORA) novo.TURNO_LANC = calcularTurno(new Date(r.DTA_HORA));
    rows.push(novo);
  });

  // Ordena descendente por data
  rows.sort((a,b)=> new Date(b.DTA_HORA||0) - new Date(a.DTA_HORA||0));
  return rows;
}

/* ---------- RENDERIZAÇÃO DOS SLIDES ---------- */
function renderSlideResumo(container, rows, total) {
  const stats = rows;

  const hoje = new Date();
  const hojeQtd = stats.filter(r=>{
    const d = new Date(r.DTA_HORA);
    return !isNaN(d) && d.toDateString() === hoje.toDateString();
  }).reduce((s,r)=>s+(Number(r.QTD_UNIDADE)||0), 0);

  const topMotivo = agruparSoma(stats, 'MOTIVO', 1)[0] || ["—",0];
  const topRua = agruparSoma(stats, 'RUA', 1)[0] || ["—",0];
  const topUsuario = agruparSoma(stats, 'USER', 1)[0] || ["—",0];

  const datas = new Set(stats.map(r=>(r.DTA_HORA||'').split('T')[0]).filter(Boolean));
  const mediaDia = datas.size ? total / datas.size : 0;

  const cards = [
    { lbl: 'Total de Avarias', val: fmtNum(total), sub: periodLabel(), cor: '' },
    { lbl: 'Avarias Hoje', val: fmtNum(hojeQtd), sub: 'Registros do dia atual', cor: 'green' },
    { lbl: 'Média Diária', val: fmtNum(mediaDia), sub: 'Unidades por dia', cor: 'amber' },
    { lbl: 'Produtos Distintos', val: fmtNum(new Set(stats.map(r=>r.PRODUTO).filter(Boolean)).size), sub: 'Itens diferentes', cor: 'purple' },
    { lbl: 'Top Motivo', val: String(topMotivo[0]).slice(0,22), sub: fmtNum(topMotivo[1]) + ' un.', cor: 'amber' },
    { lbl: 'Top Rua', val: String(topRua[0]).slice(0,22), sub: fmtNum(topRua[1]) + ' un.', cor: '' },
    { lbl: 'Top Usuário', val: String(topUsuario[0]).slice(0,22), sub: fmtNum(topUsuario[1]) + ' un.', cor: 'green' },
    { lbl: 'Ruas Afetadas', val: fmtNum(new Set(stats.map(r=>r.RUA).filter(Boolean)).size), sub: 'Locais com ocorrência', cor: 'purple' }
  ];

  const grid = document.createElement('div');
  grid.className = 'kpi-grid';
  grid.innerHTML = cards.map(c => `
    <div class="kpi-card ${c.cor}">
      <div class="lbl">${escapeHtml(c.lbl)}</div>
      <div class="val">${escapeHtml(c.val)}</div>
      <div class="sub">${escapeHtml(c.sub)}</div>
    </div>
  `).join('');
  container.appendChild(grid);
}

/* ---------- RENDERIZADOR GENÉRICO DE SLIDE ---------- */
function renderSlideAt(idx) {
  const slide = activeSlides[idx];
  if (!slide) return;

  const stage = document.getElementById('tvStage');
  if (currentChart) { currentChart.destroy(); currentChart = null; }
  stage.innerHTML = '';

  // Filtra os dados pelo período atual
  const rows = filterByPeriod(allRows);
  const total = sumQty(rows);

  // Cabeçalho do slide
  const head = document.createElement('div');
  head.className = 'slide-head';
  head.innerHTML = `
    <div class="tt">
      <h2>${escapeHtml(slide.title)}</h2>
      <p>${escapeHtml(slide.subtitle || '')}</p>
    </div>
    <div class="total-badge">
      <div class="lbl">${escapeHtml(slide.totalLabel || 'Total')}</div>
      <div class="val">${fmtNum(total)}</div>
    </div>
  `;

  const slideEl = document.createElement('div');
  slideEl.className = 'slide';
  slideEl.appendChild(head);

  const chartWrap = document.createElement('div');
  chartWrap.className = 'chart-wrap';

  // Slides tipo KPI (Resumo) → sem canvas
  if (slide.id === 'resumo') {
    slideEl.appendChild(chartWrap);
    stage.appendChild(slideEl);
    slide.render(chartWrap, rows, total);
  } else {
    const canvas = document.createElement('canvas');
    chartWrap.appendChild(canvas);
    slideEl.appendChild(chartWrap);
    stage.appendChild(slideEl);
    slide.render(canvas, rows, total);
  }

  renderDots();
  atualizarProgressoVisual(0);
}

/* ---------- DOTS / NAVEGAÇÃO ---------- */
function renderDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = activeSlides.map((s,i)=>{
    const cls = i === currentIdx ? 'dot active' : 'dot';
    return `<button class="${cls}" data-idx="${i}" title="${escapeHtml(s.title)}"></button>`;
  }).join('');
  dots.querySelectorAll('.dot').forEach(btn=>{
    btn.addEventListener('click', () => goToSlide(Number(btn.dataset.idx)));
  });
}

function goToSlide(idx) {
  if (!activeSlides.length) return;
  currentIdx = ((idx % activeSlides.length) + activeSlides.length) % activeSlides.length;
  renderSlideAt(currentIdx);
  restartTimer();
}
function nextSlide() { goToSlide(currentIdx + 1); }
function prevSlide() { goToSlide(currentIdx - 1); }

/* ---------- TIMER / PROGRESSO ---------- */
function restartTimer() {
  clearInterval(tickTimer);
  tickStart = Date.now();
  atualizarProgressoVisual(0);
  if (isPaused) return;

  tickTimer = setInterval(() => {
    const elapsed = Date.now() - tickStart;
    const dur = Math.max(3, CONFIG.intervalSec) * 1000;
    const pct = Math.min(1, elapsed / dur);
    atualizarProgressoVisual(pct);
    if (elapsed >= dur) {
      nextSlide();
    }
  }, 90);
}
function atualizarProgressoVisual(pct) {
  const bar = document.getElementById('progressBar');
  if (bar) bar.style.width = (pct*100).toFixed(2) + '%';
}
function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('btnPlay');
  btn.textContent = isPaused ? '▶' : '⏸';
  btn.title = isPaused ? 'Retomar (Espaço)' : 'Pausar (Espaço)';
  if (isPaused) {
    clearInterval(tickTimer);
    atualizarProgressoVisual(0);
  } else {
    restartTimer();
  }
}

/* ---------- CLOCK ---------- */
function atualizarRelogio() {
  const d = new Date();
  const h = pad2(d.getHours()), m = pad2(d.getMinutes()), s = pad2(d.getSeconds());
  document.getElementById('clockTime').textContent = `${h}:${m}:${s}`;
  const dd = pad2(d.getDate()), mm = pad2(d.getMonth()+1), yy = d.getFullYear();
  const semanas = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  document.getElementById('clockDate').textContent = `${semanas[d.getDay()]}, ${dd}/${mm}/${yy}`;
  document.getElementById('periodChip').textContent = periodLabel();
}
setInterval(atualizarRelogio, 1000);
atualizarRelogio();

/* ---------- CONFIG OVERLAY ---------- */
function buildChartsCheckboxes() {
  const grid = document.getElementById('cfgChartsGrid');
  const todas = buildSlides();
  grid.innerHTML = todas.map(s => `
    <label class="chk">
      <input type="checkbox" data-chart="${s.id}" ${CONFIG.active[s.id] !== false ? 'checked' : ''}/>
      <span>${escapeHtml(s.title)}</span>
    </label>
  `).join('');
}
function abrirConfig() {
  document.getElementById('cfgInterval').value = CONFIG.intervalSec;
  document.getElementById('cfgPeriod').value = CONFIG.period;
  buildChartsCheckboxes();
  document.getElementById('configOverlay').classList.add('show');
  clearInterval(tickTimer);
}
function fecharConfig() {
  document.getElementById('configOverlay').classList.remove('show');
  restartTimer();
}
function salvarConfigForm() {
  const interval = Math.max(3, Math.min(300, Number(document.getElementById('cfgInterval').value) || 15));
  const period = document.getElementById('cfgPeriod').value || '30';
  const active = {};
  document.querySelectorAll('#cfgChartsGrid input[type=checkbox]').forEach(cb => {
    active[cb.dataset.chart] = cb.checked;
  });
  if (!Object.values(active).some(v => v)) {
    alert('Selecione ao menos um gráfico para o rodízio.');
    return;
  }
  CONFIG.intervalSec = interval;
  CONFIG.period = period;
  CONFIG.active = active;
  saveConfig();
  rebuildActiveSlides();
  currentIdx = 0;
  renderSlideAt(0);
  fecharConfig();
}
function resetConfigForm() {
  if (!confirm('Restaurar as configurações padrão?')) return;
  CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  saveConfig();
  document.getElementById('cfgInterval').value = CONFIG.intervalSec;
  document.getElementById('cfgPeriod').value = CONFIG.period;
  buildChartsCheckboxes();
  rebuildActiveSlides();
  currentIdx = 0;
  renderSlideAt(0);
  fecharConfig();
}

/* ---------- HELPERS ---------- */
function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function showError(msg) {
  const b = document.getElementById('errorBanner');
  b.textContent = msg;
  b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'), 6000);
}

/* ---------- REBUILD SLIDES ATIVOS ---------- */
function rebuildActiveSlides() {
  const todas = buildSlides();
  activeSlides = todas.filter(s => CONFIG.active[s.id] !== false);
  if (!activeSlides.length) activeSlides = todas.slice(0,1);
}

/* ---------- REFRESH DADOS ---------- */
async function refreshData(silent) {
  if (!silent) {
    document.getElementById('loadingScreen').classList.remove('hide');
  }
  try {
    allRows = await fetchAllRows();
    lastFetchAt = Date.now();
    if (!silent) {
      document.getElementById('loadingScreen').classList.add('hide');
    }
    renderSlideAt(currentIdx);
    restartTimer();
  } catch (e) {
    if (!silent) {
      document.getElementById('loadingScreen').classList.add('hide');
    }
    showError('Falha ao carregar dados: ' + (e.message || e));
  }
}

/* ---------- EVENTOS ---------- */
document.getElementById('btnNext').addEventListener('click', nextSlide);
document.getElementById('btnPrev').addEventListener('click', prevSlide);
document.getElementById('btnPlay').addEventListener('click', togglePause);
document.getElementById('btnConfig').addEventListener('click', abrirConfig);
document.getElementById('cfgSave').addEventListener('click', salvarConfigForm);
document.getElementById('cfgCancel').addEventListener('click', fecharConfig);
document.getElementById('cfgReset').addEventListener('click', resetConfigForm);
document.getElementById('configOverlay').addEventListener('click', e => {
  if (e.target.id === 'configOverlay') fecharConfig();
});

document.addEventListener('keydown', e => {
  const overlayOpen = document.getElementById('configOverlay').classList.contains('show');

  if (e.key === 'Escape') {
    if (overlayOpen) { fecharConfig(); return; }
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    return;
  }
  if (overlayOpen) return;

  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  else if (e.key.toLowerCase() === 'p') { e.preventDefault(); togglePause(); }
  else if (e.key.toLowerCase() === 's') { e.preventDefault(); abrirConfig(); }
  else if (e.key.toLowerCase() === 'f') {
    e.preventDefault();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

/* Esconde a dica de fullscreen após 8s */
setTimeout(()=>{
  const h = document.getElementById('fsHint');
  if (h) h.classList.add('hide');
}, 8000);

/* Hover pausa (opcional — descomente se quiser) */
// document.addEventListener('mousemove', () => { /* ... */ });

/* Reage a resize (Chart.js já lida, mas garante redesenho) */
let resizeTO = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTO);
  resizeTO = setTimeout(() => {
    if (currentChart) currentChart.resize();
  }, 200);
});

/* ---------- BOOT ---------- */
(function boot() {
  rebuildActiveSlides();
  currentIdx = 0;
  refreshData(false);

  // Refresh automático a cada 5 minutos
  refreshTimer = setInterval(()=>refreshData(true), 5*60*1000);
})();

</script>
</body>
</html>
