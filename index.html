<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --bg-0:#f4f7fc;--bg-1:#ffffff;--bg-2:#edf3fc;
  --line:rgba(48,78,128,.15);--line-strong:rgba(59,104,183,.30);
  --ink:#17243c;--ink-soft:#50617d;--ink-faint:#72819a;
  --blue:#3b82f6;--blue-2:#60a5fa;--cyan:#22d3ee;
  --green:#16a34a;--amber:#d97706;--red:#dc2626;--purple:#9333ea;--pink:#db2777;
  --mono:'JetBrains Mono',monospace;
}
body.dark{--bg-0:#050a1f;--bg-1:#0a1230;--bg-2:#0f1a3d;--line:rgba(99,140,255,.18);--line-strong:rgba(99,140,255,.4);--ink:#f5f8ff;--ink-soft:#a8b6d9;--ink-faint:#6b7ba5;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#a855f7;--pink:#ec4899;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg-0);color:var(--ink);-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(ellipse at 15% 10%, rgba(59,130,246,.07), transparent 45%),
    radial-gradient(ellipse at 85% 90%, rgba(168,85,247,.06), transparent 45%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
  transition:background 1.1s ease,color 1.1s ease;
}
body.dark{background:radial-gradient(ellipse at 15% 10%,rgba(59,130,246,.16),transparent 45%),radial-gradient(ellipse at 85% 90%,rgba(168,85,247,.14),transparent 45%),linear-gradient(180deg,var(--bg-0) 0%,var(--bg-1) 45%,var(--bg-0) 100%)}
body:not(.dark) .brand-text h1{background:linear-gradient(90deg,#17345e,#2563eb);-webkit-background-clip:text;background-clip:text}
body:not(.dark) .slide-head h2{background:linear-gradient(90deg,#17243c,#3164ad);-webkit-background-clip:text;background-clip:text}
body:not(.dark) .period-chip{color:#244b83;background:rgba(59,130,246,.07)}
body:not(.dark) .kpi-card{background:linear-gradient(160deg,rgba(59,130,246,.07),rgba(255,255,255,.95));box-shadow:0 8px 24px rgba(32,56,93,.07)}
body:not(.dark) .config-overlay{background:rgba(15,28,52,.42)}
body:not(.dark) .config-card{box-shadow:0 24px 80px rgba(21,42,78,.18)}
body:not(.dark) .cfg-field input,body:not(.dark) .cfg-field select{color:#17243c;background:rgba(255,255,255,.86)}
body:not(.dark) .cfg-charts-grid label.chk{color:#344765;background:rgba(255,255,255,.76)}
body:not(.dark) .controls button{color:#304565;background:rgba(42,88,155,.06)}
body:not(.dark) .dot{background:rgba(42,88,155,.1)}
body:not(.dark) .fs-hint{background:rgba(255,255,255,.88);color:#52627e;box-shadow:0 4px 18px rgba(32,56,93,.12)}
.tv-shell{width:100vw;height:100vh;display:grid;grid-template-rows:clamp(64px,8vh,96px) 1fr clamp(48px,6vh,70px);padding:0 clamp(18px,2vw,34px)}
.tv-header{display:flex;align-items:center;justify-content:space-between;gap:clamp(12px,2vw,32px);border-bottom:1px solid var(--line);position:relative}
.tv-header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent 0%,var(--blue) 30%,var(--cyan) 50%,var(--blue) 70%,transparent 100%);opacity:.7}
.brand{display:flex;align-items:center;gap:clamp(12px,1.2vw,20px);min-width:0}
.brand .mark{width:clamp(40px,3.6vw,52px);height:clamp(40px,3.6vw,52px);border-radius:clamp(10px,1vw,14px);background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:clamp(14px,1.4vw,20px);color:#04122a;box-shadow:0 0 0 1px rgba(96,165,250,.4),0 0 30px rgba(59,130,246,.55),inset 0 1px 0 rgba(255,255,255,.4);flex-shrink:0}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-text h1{font-size:clamp(15px,1.6vw,24px);font-weight:900;letter-spacing:.6px;background:linear-gradient(90deg,#ffffff,#a8ccff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text p{font-size:clamp(9px,.9vw,12px);color:var(--ink-faint);letter-spacing:2.5px;text-transform:uppercase;font-weight:600;margin-top:2px}
.meta{display:flex;align-items:center;gap:clamp(10px,1.2vw,20px)}
.period-chip{padding:clamp(5px,.6vh,9px) clamp(12px,1.2vw,20px);border:1px solid var(--line-strong);border-radius:99px;background:rgba(59,130,246,.10);font-size:clamp(10px,.9vw,13px);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#c9d9ff;white-space:nowrap}
.clock{font-family:var(--mono);font-weight:700;font-size:clamp(16px,1.7vw,26px);color:var(--ink);letter-spacing:1px;white-space:nowrap;text-shadow:0 0 20px rgba(96,165,250,.35)}
.clock .date{display:block;font-family:'Inter',sans-serif;font-size:clamp(8px,.75vw,11px);font-weight:600;color:var(--ink-faint);letter-spacing:2px;text-transform:uppercase;text-align:right;margin-top:2px}
.gear{width:clamp(36px,3vw,46px);height:clamp(36px,3vw,46px);border-radius:50%;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);color:var(--ink);font-size:clamp(14px,1.3vw,20px);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.25s;flex-shrink:0}
.gear:hover{background:rgba(59,130,246,.22);border-color:var(--blue);transform:rotate(45deg)}
.tv-stage{position:relative;padding:clamp(12px,1.4vh,22px) 0;min-height:0;min-width:0}
.slide{width:100%;height:100%;display:flex;flex-direction:column;animation:slideIn .4s cubic-bezier(.2,.9,.25,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.slide-head{display:flex;align-items:flex-end;justify-content:space-between;gap:clamp(12px,2vw,32px);padding:0 clamp(6px,1vw,20px) clamp(6px,.8vh,14px);border-bottom:1px solid var(--line);margin-bottom:clamp(8px,1.2vh,18px)}
.slide-head .tt{display:flex;flex-direction:column;min-width:0}
.slide-head h2{font-size:clamp(18px,2.1vw,32px);font-weight:900;letter-spacing:.4px;line-height:1.05;background:linear-gradient(90deg,#ffffff,#c1d4ff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide-head p{font-size:clamp(10px,.9vw,13px);color:var(--ink-faint);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.slide-head .total-badge{flex-shrink:0;padding:clamp(6px,.7vh,12px) clamp(14px,1.4vw,22px);border-radius:12px;border:1px solid rgba(96,165,250,.35);background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(34,211,238,.08));text-align:right}
.total-badge .lbl{font-size:clamp(8px,.75vw,11px);font-weight:800;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase}
.total-badge .val{font-family:var(--mono);font-weight:800;font-size:clamp(18px,1.8vw,28px);color:var(--blue-2);line-height:1;margin-top:3px;text-shadow:0 0 22px rgba(96,165,250,.5)}
.chart-wrap{flex:1;min-height:0;min-width:0;position:relative;padding:0 clamp(4px,.6vw,12px)}
.chart-wrap canvas{display:block}
.chart-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,1.4vh,18px);pointer-events:none;text-align:center;padding:clamp(20px,3vh,40px)}
.chart-empty .ico{font-size:clamp(46px,4.5vw,78px);color:var(--ink-faint);opacity:.35;line-height:1}
.chart-empty .txt{font-size:clamp(13px,1.15vw,17px);font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);max-width:70%}
.chart-empty .sub{font-size:clamp(11px,.95vw,14px);font-weight:600;color:var(--ink-faint);max-width:78%;line-height:1.5}
.kpi-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1vw,18px);padding:clamp(4px,.6vh,10px) clamp(4px,.6vw,12px)}
.kpi-card{background:linear-gradient(160deg,rgba(59,130,246,.10),rgba(10,20,50,.4));border:1px solid var(--line-strong);border-radius:clamp(12px,1.1vw,18px);padding:clamp(12px,1.4vh,20px) clamp(14px,1.2vw,22px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;min-width:0}
.kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.kpi-card.amber::before{background:linear-gradient(90deg,var(--amber),#fbbf24)}
.kpi-card.red::before{background:linear-gradient(90deg,var(--red),#f87171)}
.kpi-card.purple::before{background:linear-gradient(90deg,var(--purple),var(--pink))}
.kpi-card.green::before{background:linear-gradient(90deg,var(--green),#4ade80)}
.kpi-card .lbl{font-size:clamp(9px,.85vw,12px);font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:clamp(6px,.8vh,10px)}
.kpi-card .val{font-family:var(--mono);font-weight:800;font-size:clamp(22px,2.4vw,40px);line-height:1;color:var(--blue-2);text-shadow:0 0 22px rgba(96,165,250,.35);word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kpi-card.amber .val{color:var(--amber);text-shadow:0 0 22px rgba(245,158,11,.35)}
.kpi-card.red .val{color:#f87171;text-shadow:0 0 22px rgba(239,68,68,.4)}
.kpi-card.purple .val{color:#c084fc;text-shadow:0 0 22px rgba(168,85,247,.35)}
.kpi-card.green .val{color:#4ade80;text-shadow:0 0 22px rgba(34,197,94,.35)}
.kpi-card .sub{font-size:clamp(10px,.85vw,13px);color:var(--ink-soft);font-weight:600;margin-top:clamp(6px,.8vh,10px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-footer{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(14px,1.6vw,28px);border-top:1px solid var(--line);padding-top:clamp(6px,.8vh,12px);position:relative}
.tv-footer::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--cyan) 50%,transparent);opacity:.45}
.dots{display:flex;gap:clamp(6px,.7vw,12px);flex-wrap:wrap;max-width:40vw;align-items:center}
.dot{width:clamp(10px,.9vw,14px);height:clamp(10px,.9vw,14px);border-radius:50%;border:1px solid var(--line-strong);background:rgba(255,255,255,.06);cursor:pointer;transition:.25s;padding:0}
.dot:hover{background:rgba(96,165,250,.35);transform:scale(1.15)}
.dot.active{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:var(--blue-2);box-shadow:0 0 16px rgba(96,165,250,.75);transform:scale(1.2)}
.progress-wrap{height:clamp(4px,.5vh,7px);background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;position:relative}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px;box-shadow:0 0 20px rgba(96,165,250,.65);transition:width .18s linear}
.controls{display:flex;gap:clamp(6px,.7vw,12px);align-items:center}
.controls button{width:clamp(32px,2.6vw,42px);height:clamp(32px,2.6vw,42px);border-radius:50%;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);color:var(--ink);font-size:clamp(12px,1vw,15px);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.controls button:hover{background:rgba(59,130,246,.28);border-color:var(--blue);transform:scale(1.06)}
.config-overlay{position:fixed;inset:0;z-index:9999;background:rgba(2,6,23,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:4vh 4vw;animation:fadeIn .25s ease}
.config-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.config-card{width:min(720px,100%);max-height:92vh;overflow-y:auto;background:linear-gradient(160deg,var(--bg-2),var(--bg-0));border:1px solid var(--line-strong);border-radius:22px;padding:clamp(22px,2.4vw,38px);box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 60px rgba(59,130,246,.18) inset}
.config-card h3{font-size:clamp(17px,1.5vw,22px);font-weight:900;letter-spacing:.4px;margin-bottom:6px}
.config-card .hint{font-size:clamp(11px,1vw,13px);color:var(--ink-faint);margin-bottom:clamp(18px,2vh,28px)}
.cfg-field{display:flex;flex-direction:column;gap:8px;margin-bottom:clamp(14px,1.6vh,22px)}
.cfg-field label{font-size:clamp(11px,1vw,13px);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft)}
.cfg-field input,.cfg-field select{width:100%;padding:clamp(11px,1.1vh,15px) clamp(14px,1.2vw,18px);background:rgba(255,255,255,.05);border:1px solid var(--line-strong);border-radius:12px;color:var(--ink);font-size:clamp(14px,1.15vw,16px);font-weight:600;font-family:var(--mono);transition:.2s}
.cfg-field input:focus,.cfg-field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.22);background:rgba(255,255,255,.08)}
.cfg-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.4vw,20px)}
.cfg-charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1vh,12px) clamp(14px,1.4vw,24px);margin-top:6px}
.cfg-charts-grid label.chk{display:flex;align-items:center;gap:10px;padding:clamp(10px,1.1vh,14px) clamp(12px,1vw,16px);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.2s;font-size:clamp(12px,1vw,14px);font-weight:600;color:var(--ink-soft)}
.cfg-charts-grid label.chk:hover{border-color:var(--blue);background:rgba(59,130,246,.12);color:var(--ink)}
.cfg-charts-grid label.chk input{accent-color:var(--blue);width:18px;height:18px;cursor:pointer;flex-shrink:0}
.cfg-actions{display:flex;justify-content:flex-end;gap:clamp(10px,1vw,16px);margin-top:clamp(18px,2vh,28px);padding-top:clamp(16px,2vh,24px);border-top:1px solid var(--line)}
.btn{padding:clamp(11px,1.2vh,15px) clamp(20px,1.8vw,30px);border-radius:12px;border:1px solid transparent;font-weight:800;font-size:clamp(13px,1.05vw,15px);letter-spacing:.5px;cursor:pointer;transition:.2s;font-family:'Inter',sans-serif}
.btn.primary{background:linear-gradient(135deg,var(--blue),#2563eb);color:#fff;box-shadow:0 8px 26px rgba(59,130,246,.45)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(59,130,246,.6)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink-soft)}
.btn.ghost:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.btn.danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.4);color:#fca5a5}
.btn.danger:hover{background:rgba(239,68,68,.3);color:#fff}
.loading-screen{position:fixed;inset:0;z-index:9000;background:var(--bg-0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,2.4vh,32px);transition:opacity .6s ease}
.loading-screen.hide{opacity:0;pointer-events:none}
.loading-mark{width:clamp(64px,6vw,96px);height:clamp(64px,6vw,96px);border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:900;font-size:clamp(22px,2.2vw,34px);color:#04122a;box-shadow:0 0 0 1px rgba(96,165,250,.4),0 0 50px rgba(59,130,246,.7);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.loading-text{font-size:clamp(13px,1.2vw,17px);font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--ink-soft)}
.loading-spinner{width:clamp(30px,2.8vw,42px);height:clamp(30px,2.8vw,42px);border:3px solid rgba(96,165,250,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-banner{position:fixed;top:clamp(14px,1.4vh,22px);left:50%;transform:translateX(-50%);padding:clamp(10px,1.1vh,14px) clamp(18px,1.6vw,26px);background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.5);border-radius:12px;color:#fca5a5;font-size:clamp(12px,1vw,14px);font-weight:700;z-index:9998;display:none;max-width:90vw;text-align:center}
.error-banner.show{display:block}
.fs-hint{position:fixed;bottom:clamp(14px,1.4vh,22px);right:clamp(14px,1.4vw,22px);font-size:clamp(10px,.9vw,12px);color:var(--ink-faint);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:rgba(5,10,31,.7);padding:8px 14px;border-radius:99px;border:1px solid var(--line);z-index:50;transition:.3s}
.fs-hint.hide{opacity:0;pointer-events:none}

/* Dia/noite automática, lower-third e slide de previsão local */
.theme-sky{position:absolute;z-index:0;left:50%;top:0;transform:translateX(-50%);width:clamp(125px,15vw,240px);height:100%;overflow:hidden;pointer-events:none;border-radius:0 0 18px 18px;background:linear-gradient(180deg,rgba(95,174,255,.12),rgba(255,255,255,.02));transition:background 1.1s ease}
body.dark .theme-sky{background:linear-gradient(180deg,rgba(10,22,56,.05),rgba(0,0,0,.1))}
.theme-sun,.theme-moon{position:absolute;left:15%;top:14%;font-size:clamp(24px,3vw,42px);line-height:1;color:#f6a915;filter:drop-shadow(0 0 12px rgba(246,169,21,.6));animation:sun-cross 14s ease-in-out infinite alternate;transition:opacity .8s ease}
.theme-moon{left:32%;top:19%;opacity:0;color:#edf3ff;text-shadow:0 0 18px #a4c8ff;transform:translateY(35px)}
@keyframes sun-cross{to{transform:translate(95px,12px)}}
body.dark .theme-sun{animation:sun-pass 2.6s ease-in forwards}
body.dark .theme-moon{opacity:1;animation:moon-appear 1.35s .35s cubic-bezier(.16,1,.3,1) both}
@keyframes sun-pass{to{transform:translate(150px,55px) scale(.65);opacity:0}}
@keyframes moon-appear{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:translateY(0)}}
.theme-star{position:absolute;right:12%;top:18%;font-size:12px;color:#f7f3d8;opacity:0;transition:opacity .8s ease}
body.dark .theme-star{opacity:.95}
body:not(.dark) .theme-sky{z-index:0}
.tv-header>*:not(.theme-sky){position:relative;z-index:1}
body:not(.dark) .chart-empty .ico{color:#667996;opacity:.42}
body:not(.dark) .chart-empty .txt{color:#334863}
body:not(.dark) .chart-empty .sub{color:#65748d}
body:not(.dark) .error-banner{color:#9f2525;background:#fff1f1}
body:not(.dark) .fs-hint{border-color:rgba(43,89,157,.18)}
.cfg-field input[type=checkbox]{width:20px;height:20px;accent-color:#3b82f6}
.weather-slide{height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(240px,.7fr);gap:clamp(14px,2vw,30px);padding:clamp(10px,1.5vh,20px) clamp(8px,1vw,18px);align-items:stretch}
.weather-scene{position:relative;min-height:210px;overflow:hidden;border:1px solid var(--line-strong);border-radius:22px;background:linear-gradient(150deg,#a8ddff,#e8f7ff 60%,#ffe6a8);transition:background 1s ease}
body.dark .weather-scene{background:linear-gradient(150deg,#18264c,#263c66 65%,#3c4768)}
.weather-sun-card,.weather-moon-card{position:absolute;top:12%;left:16%;font-size:clamp(54px,7vw,108px);color:#ffb83e;filter:drop-shadow(0 0 25px rgba(255,184,62,.7));animation:sun-cross 14s ease-in-out infinite alternate;transition:opacity .8s ease}
.weather-moon-card{opacity:0;color:#f2edce;filter:drop-shadow(0 0 24px rgba(195,216,255,.8));transform:translateY(50px)}
body.dark .weather-sun-card{animation:sun-pass 2.6s ease-in forwards}
body.dark .weather-moon-card{opacity:1;animation:moon-appear 1.35s .35s ease-out both}
.weather-cloud{position:absolute;top:43%;left:52%;width:clamp(74px,10vw,140px);height:34px;border-radius:99px;background:rgba(255,255,255,.87);box-shadow:28px -19px 0 -5px rgba(255,255,255,.9),-19px -12px 0 -7px rgba(255,255,255,.88);animation:cloud-drift 8s ease-in-out infinite alternate}
.weather-cloud.second{top:61%;left:22%;transform:scale(.65);opacity:.72;animation-delay:-2.5s}
@keyframes cloud-drift{to{translate:18px 0}}
.weather-ground{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(170deg,transparent 20%,rgba(41,152,156,.32) 21%)}
.weather-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.2vw,18px);align-content:center}
.weather-hour{padding:clamp(14px,1.6vw,24px);border-radius:17px;border:1px solid var(--line-strong);background:linear-gradient(150deg,rgba(59,130,246,.09),rgba(255,255,255,.7));box-shadow:0 8px 28px rgba(37,75,133,.08)}
body.dark .weather-hour{background:linear-gradient(150deg,rgba(59,130,246,.12),rgba(10,20,50,.4))}
.weather-hour .hour{font-size:clamp(12px,1vw,16px);font-weight:900;letter-spacing:1.3px;color:var(--blue-2)}
.weather-hour .temp{font-size:clamp(34px,4.2vw,64px);font-weight:900;line-height:1.2;color:var(--ink)}
.weather-hour .icon{font-size:clamp(26px,3vw,44px)}
.weather-hour .summary{font-size:clamp(11px,1.05vw,15px);font-weight:700;color:var(--ink-soft);margin-top:5px}
.weather-hour .rain{font-size:clamp(10px,.9vw,13px);font-weight:800;color:var(--blue-2);margin-top:8px}
.weather-tip{display:flex;align-items:center;gap:clamp(14px,1.5vw,24px);padding:clamp(16px,2vw,28px);border:1px solid var(--line-strong);border-radius:22px;background:linear-gradient(145deg,rgba(245,158,11,.12),rgba(59,130,246,.1));}
.weather-person{font-size:clamp(55px,7vw,100px);min-width:1.1em;text-align:center;animation:person-bob 2.8s ease-in-out infinite}
@keyframes person-bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.weather-tip strong{font-size:clamp(14px,1.5vw,21px);color:var(--ink)}
.weather-tip p{font-size:clamp(11px,1.1vw,16px);line-height:1.55;color:var(--ink-soft);margin-top:9px}
.weather-updated{font-size:clamp(9px,.8vw,11px);font-weight:700;color:var(--ink-faint);text-align:right;margin:4px 6px}
.weather-empty{grid-column:1/-1;display:grid;place-items:center;min-height:180px;color:var(--ink-soft);font-size:clamp(13px,1.3vw,18px);text-align:center;padding:20px}
.dev-lower-third{position:fixed;z-index:10020;top:clamp(12px,1.5vh,22px);left:0;min-width:min(450px,84vw);max-width:min(760px,92vw);padding:clamp(11px,1vw,16px) clamp(22px,2vw,34px) clamp(11px,1vw,16px) clamp(20px,2vw,32px);border-left:5px solid #22d3ee;border-radius:0 14px 14px 0;background:linear-gradient(105deg,#102b69,#2563eb 72%,#3b82f6);color:white;box-shadow:0 14px 42px rgba(6,26,74,.3);font-size:clamp(12px,1.1vw,16px);font-weight:900;letter-spacing:.45px;opacity:0;transform:translateX(-110%);pointer-events:none;overflow:hidden}
.dev-lower-third.show{animation:lower-third-enter .78s cubic-bezier(.16,1,.3,1) forwards}
.dev-lower-third.hide{animation:lower-third-exit .52s cubic-bezier(.7,0,.84,0) forwards}
.dev-lower-third::after{content:'';position:absolute;top:0;bottom:0;left:-45%;width:36%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-18deg)}
.dev-lower-third.show::after{animation:lower-third-shine 1.2s .4s ease-out both}
@keyframes lower-third-enter{to{opacity:1;transform:translateX(0)}}
@keyframes lower-third-exit{to{opacity:0;transform:translateX(-110%)}}
@keyframes lower-third-shine{to{left:130%}}
@media(max-width:850px){.weather-slide{grid-template-columns:1fr;grid-template-rows:minmax(110px,.75fr) auto minmax(110px,.65fr);gap:9px;padding:5px}.weather-scene{min-height:100px}.weather-hour{padding:10px}.weather-tip{padding:10px 14px}.weather-person{font-size:48px}.theme-sky{left:49%;width:110px}.lowerthird-settings{grid-template-columns:1fr}}
@media(max-height:620px){.weather-scene{min-height:120px}.weather-tip{padding:10px}.weather-person{font-size:50px}.weather-slide{gap:10px;padding:4px}}

<body>

    <div class="brand">

<div class="config-overlay" id="configOverlay">

    <p class="hint">Ajuste o comportamento da TV. As preferências ficam salvas neste navegador.</p>

    <div class="cfg-grid-2">
      <div class="cfg-field">
        <label for="cfgInterval">Intervalo entre gráficos (segundos)</label>

      </div>
      <div class="cfg-field">
        <label for="cfgPeriod">Período dos dados</label>
        <select id="cfgPeriod">
          <option value="month" selected>Mês vigente</option>
          <option value="today">Hoje</option>
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
          <option value="all">Tudo (mesmo do Dashboard)</option>
        </select>

    </div>

    <div class="cfg-grid-2 lowerthird-settings">
      <div class="cfg-field"><label for="cfgDevCreditEnabled">Crédito no topo</label><select id="cfgDevCreditEnabled"><option value="1">Exibir após abrir</option><option value="0">Não exibir</option></select></div>
      <div class="cfg-field"><label for="cfgDevCreditDuration">Duração na tela (segundos)</label><input id="cfgDevCreditDuration" type="number" min="2" max="30" step="1" value="7"/></div>
      <div class="cfg-field" style="grid-column:1/-1"><label for="cfgDevCreditText">Texto do lower third</label><input id="cfgDevCreditText" type="text" maxlength="120" value="Desenvolvido por Pablo Martins Lopes"/></div>
    </div>

    <div class="cfg-field" style="margin-bottom:8px">
      <label>Gráficos no rodízio</label>
      <div class="cfg-charts-grid" id="cfgChartsGrid"></div>
    </div>

    <div class="cfg-actions">
      <button class="btn ghost" id="cfgReset">Restaurar padrão</button>
      <button class="btn danger" id="cfgCancel">Cancelar</button>
      <button class="btn primary" id="cfgSave">Salvar e aplicar</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   TRIAGEM VISION — TV Indicador de Avarias
   Espelha a lógica do dashboard principal.
   ========================================================== */

const DEFAULT_URL = "https://jqvmvxjikbivubszoatc.supabase.co";
const DEFAULT_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impxdm12eGppa2JpdnVic3pvYXRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NTQ2NDksImV4cCI6MjA5OTUzMDY0OX0.5EVtA9L0DoKR4kdr_4cP7YtqH-FqsHJc6vpeliUMjN8";

const TV_URL_OVERRIDE = localStorage.getItem("tv_url");
const TV_KEY_OVERRIDE = localStorage.getItem("tv_key");
const SUPA_URL = (TV_URL_OVERRIDE && TV_URL_OVERRIDE.startsWith("http")) ? TV_URL_OVERRIDE : DEFAULT_URL;
const SUPA_KEY = TV_KEY_OVERRIDE || DEFAULT_KEY;

let sb = null;
try {
  sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  console.log("[TV] Conectando em:", SUPA_URL);
} catch (e) { showError("Erro ao conectar no Supabase: " + e.message); }

if (window.ChartDataLabels) Chart.register(ChartDataLabels);
if (window.Chart) {
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.color = document.body.classList.contains('dark') ? '#c1d4ff' : '#52627e';
}

/* ---------- CONFIG ---------- */
const DEFAULT_CONFIG = {
  intervalSec: 15,
  period: "month",
  active: {
    resumo: true,
    turnoTipo: true,
    motivos: true,
    ruas: true,
    categorias: true,
    itens: true,
    usuarios: true,
    donos: true,
    origens: true,
    weather: true
  }
};
let CONFIG = loadConfig();
function loadConfig() {
  try {
    const raw = localStorage.getItem("tv_config");
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    const parsed = JSON.parse(raw);
    return {
      intervalSec: Number(parsed.intervalSec) || DEFAULT_CONFIG.intervalSec,
      period: parsed.period || DEFAULT_CONFIG.period,
      active: Object.assign({}, DEFAULT_CONFIG.active, parsed.active || {})
    };
  } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
}
function saveConfig() { localStorage.setItem("tv_config", JSON.stringify(CONFIG)); }

let allRows = [];
let currentIdx = 0;
let activeSlides = [];
let currentChart = null;
let tickTimer = null;
let tickStart = 0;
let isPaused = false;
let refreshTimer = null;

/* ---------- UTILS ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function chartTextColor(){return document.body.classList.contains('dark')?'#e8eeff':'#26364d';}
function chartSoftColor(){return document.body.classList.contains('dark')?'#c1d4ff':'#536681';}
function fmtNum(n){ return Math.round(Number(n)||0).toLocaleString('pt-BR'); }
function fmtPct(n,t){ return t>0 ? ((n/t)*100).toFixed(1).replace('.',',')+'%' : '0%'; }

function calcularTurno(date) {
  const d = date || new Date();
  const minutos = d.getHours()*60 + d.getMinutes();
  if (minutos >= 7*60 && minutos < 15*60+20) return 1;
  if (minutos >= 15*60+20 && minutos < 23*60) return 2;
  return 3;
}
function sumQty(rows){ return (rows||[]).reduce((s,r)=>s+(Number(r.QTD_UNIDADE)||0),0); }

function agruparSoma(rows, campo, topN) {
  const m = {};
  rows.forEach(r => {
    const v = r[campo];
    if (v === undefined || v === null) return;
    const c = String(v).trim();
    if (!c) return;
    m[c] = (m[c] || 0) + (Number(r.QTD_UNIDADE) || 0);
  });
  let a = Object.entries(m).sort((a, b) => b[1] - a[1]);
  if (topN) a = a.slice(0, topN);
  return a;
}

/* ---------- PERÍODO (MÊS VIGENTE por padrão) ---------- */
function getCutoff() {
  const p = CONFIG.period;
  if (p === 'all') return null;
  const now = new Date();
  if (p === 'today') {
    return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  }
  if (p === 'month') {
    // MÊS VIGENTE = do dia 1 do mês atual até agora
    return new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  }
  const days = Number(p);
  const d = new Date(now.getTime() - days * 86400000);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}
function filterByPeriod(rows) {
  const cut = getCutoff();
  if (!cut) return rows;
  return rows.filter(r => {
    const d = new Date(r.DTA_HORA);
    return !isNaN(d) && d.getTime() >= cut;
  });
}
function periodLabel() {
  const p = CONFIG.period;
  if (p === 'today') return "Hoje";
  if (p === 'month') return "Mês vigente";
  if (p === 'all') return "Todo o período";
  return "Últimos " + p + " dias";
}

/* ---------- FETCH — IDÊNTICO AO DASHBOARD PRINCIPAL ---------- */
async function fetchRowsFromTable(table) {
  const pageSize=1000, rows=[];
  for(let from=0;;from+=pageSize){
    const {data,error}=await sb.from(table).select("*").range(from,from+pageSize-1);
    if(error)throw error;
    const page=data||[];rows.push(...page);
    if(page.length<pageSize)break;
  }
  return rows;
}
async function fetchAllRows() {
  if (!sb) throw new Error("Supabase não configurado.");
  const [l,r,d,g]=await Promise.all(["BD_LANC","BD_RETRABALHO","BD_DESCARTE","BD_GAIOLA"].map(fetchRowsFromTable));
  const rows = [];
  l.forEach(x => rows.push({ ...x, TIPO: "Lançamento" }));
  r.forEach(x => rows.push({ ...x, TIPO: "Retrabalho" }));
  d.forEach(x => rows.push({ ...x, TIPO: "Descarte" }));
  g.forEach(x => {
    const qtd = x["QTD UN"] || 0;
    const novaLinha = { ...x, QTD_UNIDADE: Number(qtd), TIPO: "Gaiola" };
    if (x.DTA_HORA) novaLinha.TURNO_LANC = calcularTurno(new Date(x.DTA_HORA));
    rows.push(novaLinha);
  });

  // Diagnóstico detalhado no console
  try {
    const doLanc = rows.filter(x => x.TIPO === "Lançamento");
    const comRua = rows.filter(x => x.RUA && String(x.RUA).trim()).length;
    const comRuaLanc = doLanc.filter(x => x.RUA && String(x.RUA).trim()).length;
    const comDono = rows.filter(x => x.DONO && String(x.DONO).trim()).length;
    const comOrigem = rows.filter(x => x.ORIGEM && String(x.ORIGEM).trim()).length;
    const comOrigemLanc = doLanc.filter(x => x.ORIGEM && String(x.ORIGEM).trim()).length;
    const comCat = rows.filter(x => x.CATEGORIA && String(x.CATEGORIA).trim()).length;
    const comMot = rows.filter(x => x.MOTIVO && String(x.MOTIVO).trim()).length;
    console.log("[TV] === DIAGNÓSTICO DE DADOS ===");
    console.log("[TV] Total geral:", rows.length, "| Lançamentos:", doLanc.length);
    console.log("[TV] Com RUA:", comRua, "(dos lançamentos:", comRuaLanc, ")");
    console.log("[TV] Com DONO:", comDono);
    console.log("[TV] Com ORIGEM:", comOrigem, "(dos lançamentos:", comOrigemLanc, ")");
    console.log("[TV] Com CATEGORIA:", comCat, "| Com MOTIVO:", comMot);
    if (rows.length) {
      console.log("[TV] Exemplo de registro (1º):", {
        TIPO: rows[0].TIPO,
        DTA_HORA: rows[0].DTA_HORA,
        RUA: rows[0].RUA,
        DONO: rows[0].DONO,
        ORIGEM: rows[0].ORIGEM,
        CATEGORIA: rows[0].CATEGORIA,
        MOTIVO: rows[0].MOTIVO
      });
      console.log("[TV] Colunas disponíveis:", Object.keys(rows[0]));
    }
  } catch (e) { console.warn("[TV] Falha no diagnóstico:", e); }

  return rows;
}

/* ---------- SLIDES ---------- */
function buildSlides() {
  const slides = [];

  slides.push({
    id: 'resumo', title: 'Resumo Operacional',
    subtitle: 'Visão geral do período', totalLabel: 'Unidades avariadas',
    render: renderSlideResumo
  });

  slides.push({
    id: 'turnoTipo', title: 'Avarias por Turno e Tipo',
    subtitle: 'Distribuição por turno e categoria de ocorrência', totalLabel: 'Total',
    render: (c, rows, total) => renderTurnoTipo(c, rows, total)
  });

  slides.push({
    id: 'motivos', title: 'Top 10 Motivos de Avaria',
    subtitle: 'Principais causas registradas', totalLabel: 'Total',
    render: (c, rows, total) => renderTopBar(c, rows, 'MOTIVO', total, '#f59e0b')
  });

  slides.push({
    id: 'ruas', title: 'Top 10 Ruas com Mais Avarias',
    subtitle: 'Onde as perdas se concentram', totalLabel: 'Total',
    render: (c, rows, total) => renderTopBar(c, rows, 'RUA', total, '#3b82f6')
  });

  slides.push({
    id: 'categorias', title: 'Top 10 Categorias Avariadas',
    subtitle: 'Setores com maior volume de perdas', totalLabel: 'Total',
    render: (c, rows, total) => renderTopBar(c, rows, 'CATEGORIA', total, '#ef4444')
  });

  slides.push({
    id: 'itens', title: 'Top 10 Itens Mais Avariados',
    subtitle: 'Produtos com maior recorrência', totalLabel: 'Total',
    render: (c, rows, total) => renderTopBar(c, rows, 'PRODUTO', total, '#22c55e')
  });

  slides.push({
    id: 'usuarios', title: 'Top 10 Usuários com Mais Avarias',
    subtitle: 'Ranking por usuário registrador', totalLabel: 'Total',
    render: (c, rows, total) => renderTopBar(c, rows, 'USER', total, '#22d3ee')
  });

  slides.push({
    id: 'donos', title: 'Top 10 Donos Mais Impactados',
    subtitle: 'Responsáveis pelas ruas com mais perdas', totalLabel: 'Total',
    render: (c, rows, total) => renderTopBar(c, rows, 'DONO', total, '#a855f7')
  });

  slides.push({
    id: 'origens', title: 'Top Origens das Avarias',
    subtitle: 'Etapas onde a avaria foi identificada', totalLabel: 'Total',
    render: (c, rows, total) => renderTopBar(c, rows, 'ORIGEM', total, '#ec4899')
  });

  slides.push({
    id: 'weather', title: 'Previsão do Tempo — Arujá, SP',
    subtitle: 'Condições previstas para as próximas 2 horas', totalLabel: '',
    render: (container) => renderWeatherSlide(container)
  });

  return slides;
}

/* ---------- RESUMO ---------- */
function renderSlideResumo(container, rows, total) {
  const stats = rows;
  const hoje = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const hojeQtd = stats.filter(r => {
    const d = new Date(r.DTA_HORA);
    return !isNaN(d) && new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d) === hoje;
  }).reduce((s, r) => s + (Number(r.QTD_UNIDADE) || 0), 0);

  const topMotivo = agruparSoma(stats, 'MOTIVO', 1)[0] || ["—", 0];
  const topCategoria = agruparSoma(stats, 'CATEGORIA', 1)[0] || ["—", 0];

  const datas = new Set(stats.map(r => (r.DTA_HORA || '').split('T')[0]).filter(Boolean));
  const mediaDia = datas.size ? total / datas.size : 0;
  const usersUnicos = new Set(stats.map(r => r.USER).filter(Boolean)).size;
  const ruasUnicas = new Set(stats.map(r => r.RUA).filter(v => v && String(v).trim())).size;

  const cards = [
    { lbl: 'Total de Avarias', val: fmtNum(total), sub: periodLabel(), cor: '' },
    { lbl: 'Avarias Hoje', val: fmtNum(hojeQtd), sub: 'Registros do dia', cor: 'green' },
    { lbl: 'Média Diária', val: fmtNum(mediaDia), sub: 'Unidades / dia', cor: 'amber' },
    { lbl: 'Produtos Distintos', val: fmtNum(new Set(stats.map(r => r.PRODUTO).filter(Boolean)).size), sub: 'Itens diferentes', cor: 'purple' },
    { lbl: 'Top Motivo', val: String(topMotivo[0]).slice(0, 22), sub: fmtNum(topMotivo[1]) + ' un.', cor: 'amber' },
    { lbl: 'Top Categoria', val: String(topCategoria[0]).slice(0, 22), sub: fmtNum(topCategoria[1]) + ' un.', cor: 'red' },
    { lbl: 'Usuários Ativos', val: fmtNum(usersUnicos), sub: 'Registraram avarias', cor: 'green' },
    { lbl: 'Ruas Afetadas', val: ruasUnicas ? fmtNum(ruasUnicas) : '—', sub: ruasUnicas ? 'Locais com ocorrência' : 'Sem RUA preenchida', cor: 'purple' }
  ];

  const grid = document.createElement('div');
  grid.className = 'kpi-grid';
  grid.innerHTML = cards.map(c => `
    <div class="kpi-card ${c.cor}">
      <div class="lbl">${escapeHtml(c.lbl)}</div>
      <div class="val">${escapeHtml(c.val)}</div>
      <div class="sub">${escapeHtml(c.sub)}</div>
    </div>
  `).join('');
  container.appendChild(grid);
}

/* ---------- TOP BAR ---------- */
function renderTopBar(canvas, rows, campo, total, cor) {
  const agrupado = agruparSoma(rows, campo, 10);

  if (!agrupado.length) {
    const wrap = canvas.parentElement;
    canvas.style.display = 'none';
    const box = document.createElement('div');
    box.className = 'chart-empty';
    box.innerHTML = `
      <div class="ico">∅</div>
      <div class="txt">Sem dados no período</div>
      <div class="sub">Nenhum registro de <b>${escapeHtml(campo)}</b> preenchido para <b>${escapeHtml(periodLabel())}</b>. Tente trocar para "Tudo" nas configurações.</div>
    `;
    wrap.appendChild(box);
    return;
  }

  const labels = agrupado.map(x => x[0]);
  const valores = agrupado.map(x => x[1]);

  if (currentChart) currentChart.destroy();
  currentChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: valores,
        backgroundColor: cor,
        borderRadius: 8,
        borderSkipped: false,
        barThickness: 'flex',
        maxBarThickness: 52
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 800, easing: 'easeOutQuart' },
      layout: { padding: { top: 6, right: 90, bottom: 6, left: 8 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(5,10,31,.95)', borderColor: cor, borderWidth: 1,
          titleColor: '#fff', bodyColor: '#c1d4ff', padding: 12,
          titleFont: { size: 15, weight: '700' }, bodyFont: { size: 14, weight: '600' },
          callbacks: {
            label: (item) => ' ' + fmtNum(item.parsed.x) + ' un. (' + fmtPct(item.parsed.x, total) + ')'
          }
        },
        datalabels: {
          anchor: 'end', align: 'right', offset: 6,
          color: chartTextColor(),
          font: { weight: '800', size: 15, family: 'JetBrains Mono' },
          formatter: v => v > 0 ? fmtNum(v) + ' (' + fmtPct(v, total) + ')' : ''
        }
      },
      scales: {
        x: {
          beginAtZero: true,
          grid: { color: 'rgba(99,140,255,.10)', drawBorder: false },
          ticks: { color: '#6b7ba5', font: { size: 13, weight: '600' }, callback: v => fmtNum(v) }
        },
        y: {
          grid: { display: false },
          ticks: {
            color: chartTextColor(),
            font: { size: 15, weight: '700' },
            autoSkip: false,
            callback: function(value) {
              const label = this.getLabelForValue(value);
              return String(label).length > 40 ? String(label).slice(0, 38) + '…' : label;
            }
          }
        }
      }
    },
    plugins: [window.ChartDataLabels]
  });
}

/* ---------- TURNO x TIPO ---------- */
function renderTurnoTipo(canvas, rows, total) {
  const turnos = ['1','2','3'];
  const tipos = ['Lançamento','Retrabalho','Descarte','Gaiola'];
  const cores = { 'Lançamento': '#3b82f6', 'Retrabalho': '#f59e0b', 'Descarte': '#ef4444', 'Gaiola': '#a855f7' };

  const datasets = tipos.map(t => ({
    label: t,
    data: turnos.map(tu => rows.filter(r => String(r.TURNO_LANC) === tu && r.TIPO === t).reduce((s, r) => s + (Number(r.QTD_UNIDADE) || 0), 0)),
    backgroundColor: cores[t],
    borderRadius: 6,
    borderSkipped: false,
    maxBarThickness: 120
  }));

  if (currentChart) currentChart.destroy();
  currentChart = new Chart(canvas, {
    type: 'bar',
    data: { labels: ['1º Turno','2º Turno','3º Turno'], datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 800, easing: 'easeOutQuart' },
      layout: { padding: { top: 30, right: 20, bottom: 6, left: 8 } },
      plugins: {
        legend: { position: 'bottom', labels: { color: chartSoftColor(), font: { size: 14, weight: '700' }, padding: 16, usePointStyle: true, pointStyle: 'circle', boxWidth: 11 } },
        tooltip: {
          backgroundColor: 'rgba(5,10,31,.95)', borderColor: 'rgba(96,165,250,.5)', borderWidth: 1,
          titleColor: '#fff', bodyColor: '#c1d4ff', padding: 12,
          titleFont: { size: 15, weight: '700' }, bodyFont: { size: 14, weight: '600' },
          callbacks: { label: (item) => ' ' + item.dataset.label + ': ' + fmtNum(item.parsed.y) + ' (' + fmtPct(item.parsed.y, total) + ')' }
        },
        datalabels: { anchor: 'end', align: 'end', offset: 4, color: chartTextColor(), font: { size: 12, weight: '800', family: 'JetBrains Mono' }, formatter: v => v > 0 ? fmtNum(v) : '' }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: chartTextColor(), font: { size: 17, weight: '800' } } },
        y: { beginAtZero: true, grid: { color: 'rgba(99,140,255,.10)', drawBorder: false }, ticks: { color: '#6b7ba5', font: { size: 13, weight: '600' }, callback: v => fmtNum(v) } }
      }
    },
    plugins: [window.ChartDataLabels]
  });
}

/* ---------- RENDER SLIDE ---------- */
function renderSlideAt(idx) {
  const slide = activeSlides[idx];
  if (!slide) return;

  const stage = document.getElementById('tvStage');
  if (currentChart) { currentChart.destroy(); currentChart = null; }
  stage.innerHTML = '';

  const rows = filterByPeriod(allRows);
  const total = sumQty(rows);

  const head = document.createElement('div');
  head.className = 'slide-head';
  head.innerHTML = `
    <div class="tt">
      <h2>${escapeHtml(slide.title)}</h2>
      <p>${escapeHtml(slide.subtitle || '')}</p>
    </div>
    ${slide.id === 'weather' ? '' : `<div class="total-badge">
      <div class="lbl">${escapeHtml(slide.totalLabel || 'Total')}</div>
      <div class="val">${fmtNum(total)}</div>
    </div>`}
  `;

  const slideEl = document.createElement('div');
  slideEl.className = 'slide';
  slideEl.appendChild(head);

  const chartWrap = document.createElement('div');
  chartWrap.className = 'chart-wrap';

  if (slide.id === 'resumo' || slide.id === 'weather') {
    slideEl.appendChild(chartWrap);
    stage.appendChild(slideEl);
    slide.render(chartWrap, rows, total);
  } else {
    const canvas = document.createElement('canvas');
    chartWrap.appendChild(canvas);
    slideEl.appendChild(chartWrap);
    stage.appendChild(slideEl);
    slide.render(canvas, rows, total);
  }

  renderDots();
  atualizarProgressoVisual(0);
}

/* ---------- DOTS ---------- */
function renderDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = activeSlides.map((s, i) => {
    const cls = i === currentIdx ? 'dot active' : 'dot';
    return `<button class="${cls}" data-idx="${i}" title="${escapeHtml(s.title)}"></button>`;
  }).join('');
  dots.querySelectorAll('.dot').forEach(btn => {
    btn.addEventListener('click', () => goToSlide(Number(btn.dataset.idx)));
  });
}
function goToSlide(idx) {
  if (!activeSlides.length) return;
  currentIdx = ((idx % activeSlides.length) + activeSlides.length) % activeSlides.length;
  renderSlideAt(currentIdx);
  restartTimer();
}
function nextSlide() { goToSlide(currentIdx + 1); }
function prevSlide() { goToSlide(currentIdx - 1); }

/* ---------- TIMER ---------- */
function restartTimer() {
  clearInterval(tickTimer);
  tickStart = Date.now();
  atualizarProgressoVisual(0);
  if (isPaused) return;
  tickTimer = setInterval(() => {
    const elapsed = Date.now() - tickStart;
    const dur = Math.max(3, CONFIG.intervalSec) * 1000;
    const pct = Math.min(1, elapsed / dur);
    atualizarProgressoVisual(pct);
    if (elapsed >= dur) nextSlide();
  }, 90);
}
function atualizarProgressoVisual(pct) {
  const bar = document.getElementById('progressBar');
  if (bar) bar.style.width = (pct * 100).toFixed(2) + '%';
}
function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('btnPlay');
  btn.textContent = isPaused ? '▶' : '⏸';
  if (isPaused) { clearInterval(tickTimer); atualizarProgressoVisual(0); }
  else { restartTimer(); }
}

/* ---------- CLOCK ---------- */
function atualizarRelogio() {
  const d = new Date();
  const h = pad2(d.getHours()), m = pad2(d.getMinutes()), s = pad2(d.getSeconds());
  document.getElementById('clockTime').textContent = `${h}:${m}:${s}`;
  const dd = pad2(d.getDate()), mm = pad2(d.getMonth()+1), yy = d.getFullYear();
  const semanas = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  document.getElementById('clockDate').textContent = `${semanas[d.getDay()]}, ${dd}/${mm}/${yy}`;
  document.getElementById('periodChip').textContent = periodLabel();
}
setInterval(atualizarRelogio, 1000);
atualizarRelogio();

/* ---------- CONFIG ---------- */
function buildChartsCheckboxes() {
  const grid = document.getElementById('cfgChartsGrid');
  const todas = buildSlides();
  grid.innerHTML = todas.map(s => `
    <label class="chk">
      <input type="checkbox" data-chart="${s.id}" ${CONFIG.active[s.id] !== false ? 'checked' : ''}/>
      <span>${escapeHtml(s.title)}</span>
    </label>
  `).join('');
}
function abrirConfig() {
  document.getElementById('cfgInterval').value = CONFIG.intervalSec;
  document.getElementById('cfgPeriod').value = CONFIG.period;
  document.getElementById('cfgDevCreditText').value = localStorage.getItem('tv_dev_credit_text') || 'Desenvolvido por Pablo Martins Lopes';
  document.getElementById('cfgDevCreditDuration').value = localStorage.getItem('tv_dev_credit_duration') || '7';
  document.getElementById('cfgDevCreditEnabled').value = localStorage.getItem('tv_dev_credit_enabled') || '1';
  buildChartsCheckboxes();
  document.getElementById('configOverlay').classList.add('show');
  clearInterval(tickTimer);
}
function fecharConfig() {
  document.getElementById('configOverlay').classList.remove('show');
  restartTimer();
}
function salvarConfigForm() {
  const interval = Math.max(3, Math.min(300, Number(document.getElementById('cfgInterval').value) || 15));
  const period = document.getElementById('cfgPeriod').value || 'month';
  const active = {};
  document.querySelectorAll('#cfgChartsGrid input[type=checkbox]').forEach(cb => {
    active[cb.dataset.chart] = cb.checked;
  });
  if (!Object.values(active).some(v => v)) {
    alert('Selecione ao menos um gráfico para o rodízio.');
    return;
  }
  CONFIG.intervalSec = interval;
  CONFIG.period = period;
  CONFIG.active = active;
  saveConfig();
  localStorage.setItem('tv_dev_credit_text', document.getElementById('cfgDevCreditText').value.trim() || 'Desenvolvido por Pablo Martins Lopes');
  localStorage.setItem('tv_dev_credit_duration', String(Math.max(2, Math.min(30, Number(document.getElementById('cfgDevCreditDuration').value) || 7))));
  localStorage.setItem('tv_dev_credit_enabled', document.getElementById('cfgDevCreditEnabled').value || '1');
  rebuildActiveSlides();
  currentIdx = 0;
  renderSlideAt(0);
  fecharConfig();
}
function resetConfigForm() {
  if (!confirm('Restaurar as configurações padrão?')) return;
  CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  saveConfig();
  localStorage.setItem('tv_dev_credit_text', 'Desenvolvido por Pablo Martins Lopes');
  localStorage.setItem('tv_dev_credit_duration', '7');
  localStorage.setItem('tv_dev_credit_enabled', '1');
  document.getElementById('cfgDevCreditText').value = 'Desenvolvido por Pablo Martins Lopes';
  document.getElementById('cfgDevCreditDuration').value = '7';
  document.getElementById('cfgDevCreditEnabled').value = '1';
  document.getElementById('cfgInterval').value = CONFIG.intervalSec;
  document.getElementById('cfgPeriod').value = CONFIG.period;
  buildChartsCheckboxes();
  rebuildActiveSlides();
  currentIdx = 0;
  renderSlideAt(0);
  fecharConfig();
}

/* ---------- HELPERS ---------- */
function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function showError(msg) {
  const b = document.getElementById('errorBanner');
  b.textContent = msg;
  b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 6000);
}
function rebuildActiveSlides() {
  const todas = buildSlides();
  activeSlides = todas.filter(s => CONFIG.active[s.id] !== false);
  if (!activeSlides.length) activeSlides = todas.slice(0, 1);
}

/* ---------- REFRESH ---------- */
async function refreshData(silent) {
  if(dataRefreshBusy){dataRefreshAgain=true;return;}
  dataRefreshBusy=true;
  if (!silent) document.getElementById('loadingScreen').classList.remove('hide');
  try {
    allRows = await fetchAllRows();
    if (!silent) {document.getElementById('loadingScreen').classList.add('hide');mostrarCreditoTV();}
    renderSlideAt(currentIdx);
    restartTimer();
  } catch (e) {
    if (!silent) {document.getElementById('loadingScreen').classList.add('hide');mostrarCreditoTV();}
    showError('Falha ao carregar dados: ' + (e.message || e));
  } finally {
    dataRefreshBusy=false;
    if(dataRefreshAgain){dataRefreshAgain=false;setTimeout(()=>refreshData(true),100);}
  }
}

/* ---------- EVENTOS ---------- */
document.getElementById('btnNext').addEventListener('click', nextSlide);
document.getElementById('btnPrev').addEventListener('click', prevSlide);
document.getElementById('btnPlay').addEventListener('click', togglePause);
document.getElementById('btnConfig').addEventListener('click', abrirConfig);
document.getElementById('cfgSave').addEventListener('click', salvarConfigForm);
document.getElementById('cfgCancel').addEventListener('click', fecharConfig);
document.getElementById('cfgReset').addEventListener('click', resetConfigForm);
document.getElementById('configOverlay').addEventListener('click', e => { if (e.target.id === 'configOverlay') fecharConfig(); });

document.addEventListener('keydown', e => {
  const overlayOpen = document.getElementById('configOverlay').classList.contains('show');
  if (e.key === 'Escape') {
    if (overlayOpen) { fecharConfig(); return; }
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    return;
  }
  if (overlayOpen) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  else if (e.key.toLowerCase() === 'p') { e.preventDefault(); togglePause(); }
  else if (e.key.toLowerCase() === 's') { e.preventDefault(); abrirConfig(); }
  else if (e.key.toLowerCase() === 'f') {
    e.preventDefault();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen().catch(() => {});
  }
});

setTimeout(() => { const h = document.getElementById('fsHint'); if (h) h.classList.add('hide'); }, 8000);

let resizeTO = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTO);
  resizeTO = setTimeout(() => { if (currentChart) currentChart.resize(); }, 200);
});

/* ---------- CLIMA LOCAL E TEMA AUTOMÁTICO ---------- */
const WEATHER_COORDS={lat:-23.396266,lon:-46.317545};
let weatherData=null,weatherError=false,weatherRefreshTimer=null,realtimeChannel=null,realtimeDebounce=null,dataRefreshBusy=false,dataRefreshAgain=false;
function horaSaoPaulo(date){return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(date);}
function atualizarTemaAutomatico(){const hour=Number(new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',hourCycle:'h23'}).format(new Date()));const night=hour>=18||hour<6;document.body.classList.toggle('dark',night);const sky=document.getElementById('themeSky');if(sky)sky.classList.toggle('night',night);if(window.Chart){Chart.defaults.color=chartTextColor();}}
function weatherDescription(code,rain){if(rain>=40||[51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code))return{label:'Chuva',icon:'🌧️',person:'🧍‍♀️☂️',title:'Pegue o guarda-chuva',tip:'A previsão indica possibilidade de chuva. Leve um guarda-chuva e prefira calçados que não encharquem.'};if(code===0)return{label:'Ensolarado',icon:'☀️',person:'🧴🏖️',title:'Sol pede proteção',tip:'Passe protetor solar, use boné e hidrate-se. Aplique o protetor novamente se ficar bastante tempo ao ar livre.'};if(code===1||code===2)return{label:'Parcialmente ensolarado',icon:'🌤️',person:'🧴🌴',title:'Cuide da pele',tip:'O sol pode aparecer entre nuvens. Use protetor solar, boné e mantenha água por perto.'};if(code===3)return{label:'Nublado',icon:'☁️',person:'🧥☁️',title:'Céu encoberto',tip:'A previsão é de céu nublado. Uma camada leve pode ser útil; as condições podem mudar.'};if(code>=45&&code<=48)return{label:'Neblina',icon:'🌫️',person:'🚗🌫️',title:'Atenção à visibilidade',tip:'Se for dirigir, reduza a velocidade e redobre a atenção em trechos com neblina.'};if(code>=71&&code<=86)return{label:'Frio / precipitação',icon:'❄️',person:'🧣❄️',title:'Proteja-se do frio',tip:'Vista-se em camadas e evite ficar exposto ao frio por muito tempo.'};return{label:'Tempo instável',icon:'🌦️',person:'🧥🌦️',title:'Confira antes de sair',tip:'As condições podem variar nas próximas horas. Leve uma camada leve e acompanhe a previsão.'};}
function renderWeatherSlide(container){if(!weatherData||!weatherData.slots?.length){container.innerHTML='<div class="weather-empty">'+(weatherError?'A previsão de Arujá não respondeu agora. Vou tentar novamente automaticamente.':'Consultando a previsão do tempo para Arujá, SP…')+'</div>';return;}const slots=weatherData.slots;const hourCards=slots.map(s=>{const w=weatherDescription(s.code,s.rain);return `<div class="weather-hour"><div class="hour">${s.time}</div><div class="temp">${Math.round(s.temp)}°C</div><div class="icon">${w.icon}</div><div class="summary">${w.label}</div><div class="rain">Chance de chuva: ${Math.round(s.rain)}%</div></div>`;}).join('');const risk=slots.reduce((a,b)=>b.rain>a.rain?b:a,slots[0]);const advice=weatherDescription(risk.code,risk.rain);container.innerHTML=`<div class="weather-slide"><div class="weather-scene"><span class="weather-sun-card">☀</span><span class="weather-moon-card">☾</span><span class="weather-star">✦　·　✧</span><span class="weather-cloud"></span><span class="weather-cloud second"></span><span class="weather-ground"></span></div><div class="weather-slots">${hourCards}</div><div class="weather-tip"><div class="weather-person">${advice.person}</div><div><strong>${advice.title}</strong><p>${advice.tip}</p></div></div></div><div class="weather-updated">Arujá, SP · atualização às ${weatherData.updated}</div>`;}
async function atualizarPrevisaoTempo(){try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_COORDS.lat}&longitude=${WEATHER_COORDS.lon}&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=2&timezone=America%2FSao_Paulo`;const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('Serviço indisponível');const data=await res.json(),h=data.hourly,now=Date.now(),slots=[];for(let i=0;i<h.time.length;i++){const d=new Date(h.time[i]+':00-03:00');if(d.getTime()>=now-60000){slots.push({date:d,time:horaSaoPaulo(d),temp:Number(h.temperature_2m[i]),rain:Number(h.precipitation_probability[i]??0),code:Number(h.weather_code[i]??0)});if(slots.length===2)break;}}weatherData={slots,updated:horaSaoPaulo(new Date())};weatherError=false;if(activeSlides[currentIdx]?.id==='weather')renderSlideAt(currentIdx);}catch(e){console.warn('[TV] Previsão do tempo indisponível:',e);weatherError=true;if(activeSlides[currentIdx]?.id==='weather')renderSlideAt(currentIdx);}}
function configurarRealtimeTV(){if(!sb||realtimeChannel)return;let c=sb.channel('tv-indicador-avarias-realtime');['BD_LANC','BD_RETRABALHO','BD_DESCARTE','BD_GAIOLA'].forEach(table=>{c=c.on('postgres_changes',{event:'*',schema:'public',table},()=>{clearTimeout(realtimeDebounce);realtimeDebounce=setTimeout(()=>refreshData(true),180);});});realtimeChannel=c.subscribe(status=>console.log('[TV] Realtime:',status));}
let creditHideTimer=null;
function mostrarCreditoTV(){if(localStorage.getItem('tv_dev_credit_enabled')==='0')return;const node=document.getElementById('devLowerThird')||(()=>{const n=document.createElement('div');n.id='devLowerThird';n.className='dev-lower-third';n.setAttribute('role','status');document.body.appendChild(n);return n;})();node.textContent=localStorage.getItem('tv_dev_credit_text')||'Desenvolvido por Pablo Martins Lopes';const seconds=Math.max(2,Math.min(30,Number(localStorage.getItem('tv_dev_credit_duration')||7)));clearTimeout(creditHideTimer);node.classList.remove('hide','show');void node.offsetWidth;node.classList.add('show');creditHideTimer=setTimeout(()=>{node.classList.remove('show');node.classList.add('hide');},seconds*1000);}

/* ---------- BOOT ---------- */
(function boot() {
  rebuildActiveSlides();
  currentIdx = 0;
  atualizarTemaAutomatico();
  setInterval(atualizarTemaAutomatico,60000);
  configurarRealtimeTV();
  atualizarPrevisaoTempo();
  weatherRefreshTimer=setInterval(atualizarPrevisaoTempo,5*60*1000);
  refreshData(false);
  refreshTimer = setInterval(() => refreshData(true), 5 * 60 * 1000);
})();

</script>
